name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders; pages are force-dynamic so no DB is hit
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEXTAUTH_SECRET: ci-build-secret
          NEXTAUTH_URL: http://localhost:3000

  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: steelcfo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/steelcfo
      NEXTAUTH_SECRET: ci-smoke-secret
      NEXTAUTH_URL: http://localhost:3000
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema and seed
        run: npx prisma db push && npm run db:seed

      - name: Build
        run: npm run build

      - name: Smoke test all routes
        run: |
          npm run start -- -p 3000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done
          fail=0
          for path in /api/health / /dashboard /dashboard/jobs /dashboard/cash \
                      /dashboard/receivables /dashboard/payables /dashboard/risk \
                      /dashboard/reports /dashboard/chat /login; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "http://localhost:3000$path")
            echo "$code $path"
            [ "$code" = "200" ] || fail=1
          done
          # Rendered pages must not contain NaN/Infinity artifacts
          curl -s http://localhost:3000/dashboard | grep -qE "NaN|Infinity" && fail=1
          exit $fail
